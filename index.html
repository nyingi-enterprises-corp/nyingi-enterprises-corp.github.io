<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting — Nyingi Enterprises Corp.</title>
  <link rel="canonical" href="https://www.nyingienterprises.com/" />
  <noscript>
    <meta http-equiv="refresh" content="1; url=https://nyingi-enterprises-corp.web.app/" />
  </noscript>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 25%, rgba(20, 184, 166, 0.16), #040814 65%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 460px;
      padding: 32px 28px;
      border-radius: 20px;
      background: rgba(10, 18, 36, 0.85);
      border: 1px solid rgba(45, 212, 191, 0.25);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #2dd4bf;
      margin-bottom: 12px;
      font-weight: 700;
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 18px; }
    a {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 999px;
      background: linear-gradient(135deg, #2dd4bf, #0ea5e9);
      color: #02131d;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
    }
  </style>
  <script>
    (function () {
      var suffix = (window.location.pathname && window.location.pathname !== '/' ? window.location.pathname : '') +
                   (window.location.search || '') +
                   (window.location.hash || '');
      var primary = 'https://www.nyingienterprises.com' + (suffix || '/');
      var fallback = 'https://nyingi-enterprises-corp.web.app' + (suffix || '/');

      var settled = false;
      function go(url) {
        if (settled) return;
        settled = true;
        window.location.replace(url);
      }

      var timer = setTimeout(function () { go(fallback); }, 900);
      fetch('https://www.nyingienterprises.com/favicon.svg', { mode: 'no-cors', cache: 'no-store' })
        .then(function () { clearTimeout(timer); go(primary); })
        .catch(function () { clearTimeout(timer); go(fallback); });
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="badge">Nyingi Enterprises Corp. · CAGE 9SRW4</div>
    <h1>Redirecting to Official Portal…</h1>
    <p>Taking you to <strong>nyingienterprises.com</strong> for Capabilities Statements, SAM.gov procurement details, and technical briefs.</p>
    <a href="https://nyingi-enterprises-corp.web.app/">Continue Now &rarr;</a>
  </div>
</body>
</html>
